{% extends 'blog_app/base.html' %}
{% load blog_tags %}

{% block title %}Главная страница{% endblock %}

{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            {% for blog in blogs %}
            <div class="col">
                <div class="card shadow-sm">
                    <img src="{{ object.preview | media_filter }}" height="275" width="100%">
                    <div class="card-body">
                        <p class="card-text">Название блога: {{blog.title}}</p>
                        <p class="card-text">Содержание: {{blog.content|truncatechars:37}}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <a class="btn btn-outline-primary" href="{% url 'blog_app:blog_detail' blog.pk %}"
                                   role="button"> Подробнее </a>
                                <a class="btn btn-outline-secondary" href="{% url 'blog_app:blog_edit' blog.pk %}"
                                   role="button"> Редактировать </a>
                                <a class="btn btn-outline-danger" href="{% url 'blog_app:blog_delete' blog.pk %}"
                                   role="button"> Удалить </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
