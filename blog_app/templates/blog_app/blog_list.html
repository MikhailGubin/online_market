{% extends 'blog_app/base.html' %}
{% load my_tags %}

{% block title %}Главная страница{% endblock %}

{% block content %}
    <div class="album py-5 bg-body-tertiary">
        <div class="container">
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
                {% for blog in object_list %}
                <div class="col">
                    <div class="card shadow-sm">
                        <img src="{{ blog_app.preview | media_filter }}" height="275" >
                        <div class="card-body">
                          <p class="card-text">Название блога: {{blog.title}}</p>
                          <p class="card-text">Содержание: {{blog.content|truncatechars:37}}</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <div class="btn-group">
                                    <a class="btn btn-outline-primary" href="{% url 'blog_app:blog_detail' product.pk %}" role="button"> Подробнее </a>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
{% endblock %}
